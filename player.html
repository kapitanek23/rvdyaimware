<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Gracza - Team Profile</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <button class="menu-toggle" id="menu-toggle">
        <span></span><span></span><span></span>
    </button>

    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>MENU</h2>
        </div>
        <div class="sidebar-nav">
            <a href="index.html"><span>🏠</span> Home</a>

            <a href="player.html"><span>👥</span> Drużyna</a>

            <a href="watch.html"><span>📺</span> Oglądanie</a>

            <a href="/typer/"><span>🏆</span> Typer</a>

            <a href="/typer-admin/"><span>🛠️</span> Typer Admin</a>
        </div>
    </nav>

    <main class="team-section">
        <h1 class="page-title">NASZ SKŁAD</h1>
        <div id="team-grid" class="team-grid"></div>
    </main>

    <div id="player-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="close-modal" id="close-modal">&times;</button>

            <div class="modal-body">

                <div class="modal-left">
                    <img id="m-img" src="" alt="Player Avatar">
                </div>

                <div class="modal-right">

                    <div class="modal-header-group">
                        <h2 id="m-nick">NICK</h2>
                        <span id="m-role" class="badge">ROLA</span>
                    </div>

                    <p id="m-desc" class="modal-desc">Opis gracza...</p>

                    <div class="modal-stats-wrapper">

                        <div class="stats-primary">
                            <div class="stat-box big-rating-box">
                                <span class="stat-label">RATING</span>
                                <strong id="m-rating" class="stat-value-big">0.00</strong>
                            </div>
                            <div class="rating-split">
                                <div class="stat-box small-box t-side">
                                    <span class="stat-label">T-SIDE</span>
                                    <strong id="m-tRating">0.00</strong>
                                </div>
                                <div class="stat-box small-box ct-side">
                                    <span class="stat-label">CT-SIDE</span>
                                    <strong id="m-ctRating">0.00</strong>
                                </div>
                            </div>
                        </div>

                        <div class="stats-secondary">
                            <div class="stat-box">
                                <span class="stat-label">K/D RATIO</span>
                                <strong id="m-kd">0.00</strong>
                            </div>
                            <div class="stat-box">
                                <span class="stat-label">HS %</span>
                                <strong id="m-hs">0%</strong>
                            </div>
                            <div class="stat-box">
                                <span class="stat-label">WIN RATE</span>
                                <strong id="m-winRate" style="color: #4CAF50;">0%</strong>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
            <div class="modal-video">
                <iframe id="m-video" src="" frameborder="0" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script src="js/players.js"></script>

    <script>
        const gridContainer = document.getElementById('team-grid');
        const modal = document.getElementById('player-modal');
        const closeModalBtn = document.getElementById('close-modal');

        // Sprawdzamy czy playersData w ogóle się załadowało
        if (typeof playersData === 'undefined') {
            console.error("Błąd: Nie znaleziono danych graczy. Sprawdź plik js/players.js");
            gridContainer.innerHTML = "<h2>Błąd ładowania danych</h2>";
        } else {
            // Generowanie kafelków
            Object.keys(playersData).forEach(key => {
                const player = playersData[key];

                const card = document.createElement('div');
                card.classList.add('player-card-mini');
                card.setAttribute('data-id', key);

                card.innerHTML = `
                    <img src="${player.image}" alt="${player.nick}">
                    <div class="mini-info">
                        <h3>${player.nick}</h3>
                        <span>${player.role}</span>
                    </div>
                `;

                gridContainer.appendChild(card);

                card.addEventListener('click', () => {
                    openModal(player);
                });
            });
        }

        function openModal(data) {
            document.getElementById('m-nick').innerText = data.nick;
            document.getElementById('m-role').innerText = data.role;
            document.getElementById('m-desc').innerText = data.desc;
            document.getElementById('m-img').src = data.image;

            document.getElementById('m-rating').innerText = data.stats.rating;
            document.getElementById('m-tRating').innerText = data.stats.tRating || "-";
            document.getElementById('m-ctRating').innerText = data.stats.ctRating || "-";

            document.getElementById('m-kd').innerText = data.stats.kd;
            document.getElementById('m-hs').innerText = data.stats.hs;
            document.getElementById('m-winRate').innerText = data.stats.winRate || "0%";

            document.getElementById('m-video').src = data.video;

            modal.classList.add('active');
        }

        function closeModal() {
            modal.classList.remove('active');
            document.getElementById('m-video').src = ""; // Stop wideo
        }

        closeModalBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === "Escape" && modal.classList.contains('active')) closeModal();
        });

        // Obsługa menu bocznego
        document.getElementById('menu-toggle').addEventListener('click', function () {
            document.getElementById('sidebar').classList.toggle('active');
        });
    </script>
</body>

</html>
