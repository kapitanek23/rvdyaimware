        const LOCAL_UPDATE_TIMEOUT = 1000;

        let player;
        let isPlayerReady = false;
        let localUpdate = false;
        let sessionId = 'session_' + Math.random().toString(36).substring(2, 11) + Date.now();
        let currentQueue = [];

        // YouTube Helper
        function extractYouTubeId(url) {
            const patterns = [
                /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([^&\?\/]+)/,
                /^([a-zA-Z0-9_-]{11})$/
            ];
            for (let pattern of patterns) {

                if (match) return match[1];
            }
            return null;

        // --- Player Logic ---

        function onYouTubeIframeAPIReady() {
            console.log('YouTube API Ready');
            loadQueue();
        }

        function createPlayer(videoId) {
            const wrapper = document.getElementById('video-wrapper');
            wrapper.innerHTML = '<div id="youtube-player"></div>';

            player = new YT.Player('youtube-player', {
                videoId: videoId,
                playerVars: { autoplay: 1, controls: 1, modestbranding: 1, rel: 0 },
                events: {
                    onReady: onPlayerReady,
                    onStateChange: onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            isPlayerReady = true;
            syncPlayerStateOnReady();
        }

        function onPlayerStateChange(event) {
            if (localUpdate) return;
            const state = event.data;
            const currentTime = player.getCurrentTime();

            if (state === YT.PlayerState.PLAYING) updatePlayerState(true, currentTime);
            else if (state === YT.PlayerState.PAUSED) updatePlayerState(false, currentTime);
            else if (state === YT.PlayerState.ENDED) playNextVideo();
        }

        async function updatePlayerState(isPlaying, currentTime) {
            try {
                const { data: currentState } = await sb.from('player_state').select('id').single();
                if (currentState) {
                    await sb.from('player_state').update({
                        is_playing: isPlaying,
                        current_time: currentTime,
                        updated_at: new Date().toISOString()
                    }).eq('id', currentState.id);
                }
            } catch (error) { console.error(error); }
        }

        async function syncPlayerStateOnReady() {
            try {
                const { data: playerState } = await sb.from('player_state').select('*').single();
                if (playerState && player && isPlayerReady) {
                    localUpdate = true;
                    // Jeśli wideo jest inne niż w playerze, załaduj je
                    if (player.getVideoData().video_id !== playerState.current_video_id) {
                        player.loadVideoById(playerState.current_video_id, playerState.current_time || 0);
                    } else {
                        player.seekTo(playerState.current_time || 0, true);
                    }

                    if (playerState.is_playing) player.playVideo();
                    else player.pauseVideo();

                    setTimeout(() => { localUpdate = false; }, 1000);
                }
            } catch (error) { console.error(error); }
        }

            try {

                const thumbUrl = `https://img.youtube.com/vi/${item.youtube_id}/default.jpg`;

                return `
                <div class="queue-item ${isPlaying ? 'playing' : ''}" data-id="${item.id}">
                    <div class="queue-handle">☰</div>
                    <img src="${thumbUrl}" class="queue-thumb" alt="thumb">
                    <div class="queue-info">
                        <div class="queue-title" title="${item.title}">
                            ${isPlaying ? '▶ ' : ''}${index + 1}. ${item.title}
                        </div>
                        <div class="queue-meta">Dodał: ${item.added_by || 'Anon'}</div>
                    </div>
                    <div class="queue-actions">
                        <button class="queue-btn" onclick="playVideo('${item.youtube_id}')" title="Play">Play</button>
                        <button class="queue-btn delete" onclick="removeFromQueue(${item.id})" title="Remove">X</button>
                    </div>
                </div>
                `;
            }).join('');
        }

        // SortableJS Init
        new Sortable(document.getElementById('queue-list'), {
            handle: '.queue-handle',
            animation: 150,
            onEnd: async function (evt) {
                const items = document.querySelectorAll('.queue-item');
                const updates = Array.from(items).map((item, index) => ({
                    id: item.dataset.id,
                    position: index
                }));

                // Update positions in Supabase
                const { error } = await sb.from('queue').upsert(updates);
                if (error) console.error('Error reordering:', error);
            }
        });

        // Add Video
        document.getElementById('add-video-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('youtube-url');
            const videoId = extractYouTubeId(input.value);

            if (!videoId) {
                alert('Błędny link YouTube!');
                return;
            }

            // Get video title (optional, using dummy for now or fetch if possible via no-cors proxy trick, skipping for simplicity)
            const title = `Video ${videoId}`;

            try {
                // Get max position
                const maxPos = currentQueue.length > 0 ? Math.max(...currentQueue.map(i => i.position)) : -1;

                await sb.from('queue').insert({
                    youtube_id: videoId,
                    title: videoId, // Tytuł tymczasowy, w idealnym świecie fetch z YT API
                    position: maxPos + 1,
                    added_by: 'User' // Można by dodać prompt o nick
                });

                input.value = '';
                // loadQueue handled by realtime
            } catch (error) { console.error(error); }
        });

        // Play specific video
        window.playVideo = async function (videoId) {
            try {
                const { data: state } = await sb.from('player_state').select('id').single();
                await sb.from('player_state').update({
                    current_video_id: videoId,
                    current_time: 0,
                    is_playing: true,
                    updated_at: new Date().toISOString()
                }).eq('id', state.id);

                if (!player) createPlayer(videoId);
                else {
                    localUpdate = true;
                    player.loadVideoById(videoId);
                    setTimeout(() => { localUpdate = false; }, 1000);
                }
            } catch (error) { console.error(error); }
        };

        // Remove from queue
        window.removeFromQueue = async function (id) {
            if (confirm('Na pewno usunąć?')) {
                await sb.from('queue').delete().eq('id', id);
            }
        };

        // Skip / Next Video
        document.getElementById('skip-video').addEventListener('click', playNextVideo);

        async function playNextVideo() {
            try {
                const { data: playerState } = await sb.from('player_state').select('*').single();

                // Find current video index
                const currentIndex = currentQueue.findIndex(v => v.youtube_id === playerState.current_video_id);

                let nextVideo = null;

                // If current exists, play next
                if (currentIndex !== -1 && currentIndex < currentQueue.length - 1) {
                    nextVideo = currentQueue[currentIndex + 1];
                }
                // If nothing playing or end of list, try first one again (loop) or stop? 
                // Let's loop for now or pick first valid
                else if (currentQueue.length > 0) {
                    nextVideo = currentQueue[0];
                }

                if (nextVideo) {
                    console.log('Skipping to:', nextVideo.title);
                    playVideo(nextVideo.youtube_id);
                } else {
                    console.log('No next video found');
                }
            } catch (error) { console.error(error); }
        }

        // Global Controls
        document.getElementById('global-play').addEventListener('click', () => updatePlayerWithLocal(true));
        document.getElementById('global-pause').addEventListener('click', () => updatePlayerWithLocal(false));

        document.getElementById('seek-backward').addEventListener('click', async () => {
            if (!player) return;
            const newTime = Math.max(0, player.getCurrentTime() - 10);
            updatePlayerTime(newTime);
            player.seekTo(newTime, true);
        });

        document.getElementById('seek-forward').addEventListener('click', async () => {
            if (!player) return;
            const newTime = Math.min(player.getDuration(), player.getCurrentTime() + 10);
            updatePlayerTime(newTime);
            player.seekTo(newTime, true);
        });

        async function updatePlayerWithLocal(playing) {
            if (!player) return;
            const time = player.getCurrentTime();
            updatePlayerState(playing, time);

            localUpdate = true;
            if (playing) player.playVideo(); else player.pauseVideo();
            setTimeout(() => { localUpdate = false; }, 500);
        }

        async function updatePlayerTime(time) {
            try {
                const { data: state } = await sb.from('player_state').select('id').single();
                await sb.from('player_state').update({
                    current_time: time,
                    updated_at: new Date().toISOString()
                }).eq('id', state.id);
            } catch (e) { console.error(e); }
        }

        // Realtime Listeners
        sb.channel('public:player_state')
            .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'player_state' }, (payload) => {
                if (!player || !isPlayerReady || localUpdate) return;

                const newState = payload.new;
                localUpdate = true;

                // Video Change
                if (newState.current_video_id && player.getVideoData().video_id !== newState.current_video_id) {
                    player.loadVideoById(newState.current_video_id, newState.current_time || 0);
                }
                // Time Sync
                else {
                    const diff = Math.abs(player.getCurrentTime() - (newState.current_time || 0));
                    if (diff > 2) player.seekTo(newState.current_time || 0, true);
                }

                // Play/Pause
                if (newState.is_playing) player.playVideo();
                else player.pauseVideo();

                setTimeout(() => { localUpdate = false; }, 1000);
            })
            .subscribe();

        sb.channel('public:queue')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'queue' }, () => {
                loadQueue(); // Reload whole queue on change
            })
            .subscribe();
        // Generate or retrieve a persistent random nickname
        let myNickname = localStorage.getItem('chatNickname');
        if (!myNickname) {
            myNickname = 'User' + Math.floor(Math.random() * 10000);
            localStorage.setItem('chatNickname', myNickname);
        }

        // Presence (Online Counter) - track by nickname
        async function updatePresence() {
            try {
                await sb.from('online_users').upsert({
                    session_id: sessionId,
                    nickname: myNickname,
                    last_seen: new Date().toISOString()
                }, { onConflict: 'session_id' });
                await sb.from('online_users').delete().lt('last_seen', new Date(Date.now() - USER_TIMEOUT_MS).toISOString());
                const { data } = await sb.from('online_users').select('*');

                if (data) {
                    // Count unique nicknames
                    const uniqueNicks = [...new Set(data.map(u => u.nickname || 'Anon'))];
                    document.getElementById('online-count').textContent = uniqueNicks.length;

                    // Build user list
                    const listEl = document.getElementById('online-list');
                    listEl.innerHTML = uniqueNicks.map(nick =>
                        `<div class="online-list-item"><span class="dot-mini"></span>${nick.replace(/</g, '&lt;')}</div>`
                    ).join('');
                }
            } catch (e) { console.error('Presence error:', e); }
        }
        setInterval(updatePresence, PRESENCE_UPDATE_INTERVAL);
        updatePresence();

        // Clear queue logic
        document.getElementById('clear-queue').addEventListener('click', async () => {
            if (confirm('Wyczyścić CAŁĄ kolejkę?')) {
                await sb.from('queue').delete().neq('id', 0);
            }
        });

        // --- Chat Logic ---
        const chatInput = document.getElementById('chat-input');
        const chatForm = document.getElementById('chat-form');
        const chatContainer = document.getElementById('chat-messages');
        const renderedMsgIds = new Set();

        // Inline Nickname Logic
        const nicknameDisplay = document.getElementById('nickname-display');
        nicknameDisplay.value = myNickname;

        nicknameDisplay.addEventListener('change', () => {
            const newNick = nicknameDisplay.value.trim();
            if (newNick) {
                myNickname = newNick;
                localStorage.setItem('chatNickname', myNickname);
            } else {
                nicknameDisplay.value = myNickname;
            }
        });

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = chatInput.value.trim();
            if (!text) return;
            chatInput.value = '';

            try {
                const { error } = await sb.from('chat_messages').insert({
                    content: text,
                    author: myNickname
                });
                if (error) {
                    console.error('Database error:', error);
                    appendMessage({ author: myNickname, content: text, created_at: new Date().toISOString(), error: true });
                }
            } catch (error) {
                console.error('Chat error:', error);
                appendMessage({ author: myNickname, content: text, created_at: new Date().toISOString(), error: true });
            }
        });

        // Load Chat History
        async function loadChat() {
            try {
                const { data, error } = await sb
                    .from('chat_messages')
                    .select('*')
                    .order('created_at', { ascending: false })
                    .limit(100);

                if (error) {
                    console.error('Error loading chat:', error);
                    chatContainer.innerHTML = '<div class="chat-message"><span class="author" style="color:#f87171">System:</span> Nie udało się załadować historii czatu.</div>';
                    return;
                }

                if (data && data.length > 0) {
                    chatContainer.innerHTML = '';
                    data.reverse().forEach(msg => {
                        renderedMsgIds.add(msg.id);
                        appendMessage(msg);
                    });
                    scrollToBottom();
                } else {
                    chatContainer.innerHTML = '<div class="chat-message"><span class="author" style="color:#52525b">System:</span> Brak wiadomości. Napisz coś!</div>';
                }
            } catch (e) {
                console.error('Error loading chat:', e);
                chatContainer.innerHTML = '<div class="chat-message"><span class="author" style="color:#f87171">System:</span> Błąd połączenia z czatem.</div>';
            }
        }

        // Realtime Subscription
        const chatChannel = sb.channel('realtime-chat')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_messages' }, (payload) => {
                const msg = payload.new;
                if (renderedMsgIds.has(msg.id)) return; // Skip duplicates
                renderedMsgIds.add(msg.id);
                appendMessage(msg);
                scrollToBottom();
            })
            .subscribe((status) => {
                console.log('Chat realtime status:', status);
            });

        function formatTime(isoString) {
            if (!isoString) return '';
            try {
                const d = new Date(isoString);
                return d.toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit' });
            } catch { return ''; }
        }

        function appendMessage(msg) {
            const div = document.createElement('div');
            div.className = 'chat-message';
            const color = getStringColor(msg.author || 'Anon');

            const safeContent = (msg.content || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            const safeAuthor = (msg.author || 'Anon').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            const time = formatTime(msg.created_at);

            div.innerHTML = `<span class="author" style="color: ${color}">${safeAuthor}</span><span class="timestamp">${time}</span><br><span class="content" ${msg.error ? 'style="opacity:0.5"' : ''}>${safeContent}</span>`;
            chatContainer.appendChild(div);
        }

        function scrollToBottom() {
            requestAnimationFrame(() => {
                chatContainer.scrollTop = chatContainer.scrollHeight;
            });
        }

        function getStringColor(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            // Generate pleasant pastel-ish colors
            const h = Math.abs(hash) % 360;
            return `hsl(${h}, 70%, 65%)`;
        }

        // Init Chat
        loadChat();

    </script>
</body>

</html>
