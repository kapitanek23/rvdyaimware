    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHYBA ZOSTALES ROZJEBANY</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            /* Ciemne tło */
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Styl nakładki powitalnej (wymuszenie kliknięcia dla dźwięku) */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 1000;
            cursor: pointer;
        }

        #overlay h1 {
            font-size: 2rem;
            margin-bottom: 20px;
        }

        #overlay p {
            font-size: 1.2rem;
            color: #bbb;
            border: 1px solid #bbb;
            padding: 10px 20px;
            border-radius: 5px;
        }

        /* Kontener na filmy */
        .container {
            width: 90%;
            max-width: 800px;
            /* Maksymalna szerokość na PC */
            padding: 20px 0;
            display: none;
            /* Ukryte dopóki nie klikniesz w overlay */
            flex-direction: column;
            gap: 30px;
            /* Odstęp między filmami */
        }

        /* Stylizacja embedów */
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            /* Proporcje 16:9 */
            height: 0;
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Sekcja ciekawostek */
        .trivia-section {
            width: 100%;
            margin-top: 50px;
            padding: 30px;
            background: linear-gradient(135deg, #1e1e1e 0%, #2a2a2a 100%);
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
            border: 1px solid #333;
        }

        .trivia-section h2 {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.1);
        }

        .trivia-content {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #e0e0e0;
            text-align: center;
            padding: 20px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease-in-out;
        }

        .trivia-content.fade-out {
            opacity: 0;
        }

        .trivia-content.fade-in {
            opacity: 1;
        }
    </style>
</head>

<body>

    <div id="overlay">
        <h1>Witaj</h1>
        <p>Kliknij, aby zobaczyć co potrafi rvdyaimware</p>
    </div>

    <audio id="bg-music" loop>
        <source src="muzyka.mp3" type="audio/mpeg">
        Twoja przeglądarka nie obsługuje elementu audio.
    </audio>

    <div class="container" id="main-content">

        <div class="video-wrapper">
            <iframe src="https://www.youtube.com/embed/-2K4ad4tRh4" title="YouTube video player"
                allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen
                loading="lazy"> </iframe>
        </div>

        <div class="video-wrapper">
            <iframe src="https://www.youtube.com/embed/oL1wo-KRw_0" title="YouTube video player" allowfullscreen
                loading="lazy">
            </iframe>
        </div>

        <!-- Sekcja ciekawostek -->
        <div class="trivia-section">
            <h2>💡 Ciekawe ciekawostki</h2>
            <div class="trivia-content" id="trivia-text">
                Ładowanie ciekawostki...
            </div>
        </div>

    </div>

    <script>
        const overlay = document.getElementById('overlay');
        const audio = document.getElementById('bg-music');
        const content = document.getElementById('main-content');

        overlay.addEventListener('click', () => {
            // Próba odtworzenia dźwięku
            audio.play().then(() => {
                // Jeśli się uda, ukryj overlay i pokaż treść
                overlay.style.display = 'none';
                content.style.display = 'flex';
            }).catch(error => {
                console.log("Błąd odtwarzania:", error);
                // Fallback: nawet jak audio nie pójdzie, pokaż treść
                overlay.style.display = 'none';
                content.style.display = 'flex';
            });
        });

        // System ciekawostek
        let triviaList = [];
        let currentTriviaIndex = -1;
        let triviaTimeout;

        // Pobierz ciekawostki z pliku JSON
        fetch('ciekawostki.json')
            .then(response => response.json())
            .then(data => {
                triviaList = data;
                showRandomTrivia(); // Pokaż pierwszą ciekawostkę
            })
            .catch(error => {
                console.error('Błąd ładowania ciekawostek:', error);
                document.getElementById('trivia-text').textContent = 
                    'Nie udało się załadować ciekawostek 😔';
            });

        function showRandomTrivia() {
            if (triviaList.length === 0) return;
            
            const triviaElement = document.getElementById('trivia-text');
            
            // Fade out
            triviaElement.classList.add('fade-out');
            
            setTimeout(() => {
                // Wybierz losową ciekawostkę (inną niż poprzednia)
                let newIndex;
                do {
                    newIndex = Math.floor(Math.random() * triviaList.length);
                } while (newIndex === currentTriviaIndex && triviaList.length > 1);
                
                currentTriviaIndex = newIndex;
                triviaElement.textContent = triviaList[currentTriviaIndex];
                
                // Fade in
                triviaElement.classList.remove('fade-out');
                triviaElement.classList.add('fade-in');
                
                // Oblicz dynamiczny czas wyświetlania
                const wordCount = triviaList[currentTriviaIndex].split(' ').length;
                const displayTime = 8000 + (wordCount * 400); // 8 sek + 0.4 sek za słowo
                
                // Zaplanuj następną zmianę
                clearTimeout(triviaTimeout);
                triviaTimeout = setTimeout(showRandomTrivia, displayTime);
            }, 500); // Czas trwania animacji fade-out
        }
    </script>
</body>


</html>
